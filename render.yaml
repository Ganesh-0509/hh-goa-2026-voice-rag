services:
  - type: web
    name: hh-goa-2026-voice-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_URL
        value: https://api.sarvam.ai/speech-to-text
      - key: SARVAM_STT_MODEL
        value: saarika:v2.5
      - key: QDRANT_URL
        value: http://localhost:6333
      - key: QDRANT_COLLECTION
        value: msmarco_xi_chunks
      - key: EMBED_MODEL
        value: intfloat/multilingual-e5-small
      - key: SQLITE_FTS_PATH
        value: storage/chunks.sqlite
      - key: GENERATION_MODE
        value: extractive
      - key: MIN_DENSE_SCORE
        value: "0.50"
      - key: MIN_DENSE_MARGIN
        value: "0.055"
      - key: MAX_CONTEXT_CHARS
        value: "1800"
      - key: STT_CACHE_ENABLED
        value: "false"
